<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9E4F"/>
      <stop offset="100%" stop-color="#1F7A3A"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with subtle shadow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="225" fill="#E8F5E0" opacity="0.15" />

  <!-- Trash Can Body -->
  <path d="M 170 190 L 190 410 C 192 430 205 440 225 440 L 287 440 C 307 440 320 430 322 410 L 342 190 Z" fill="#2E9E4F" stroke="#1F7A3A" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Can stripes / ribs -->
  <line x1="225" y1="230" x2="235" y2="400" stroke="#1F7A3A" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <line x1="256" y1="230" x2="256" y2="400" stroke="#1F7A3A" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <line x1="287" y1="230" x2="277" y2="400" stroke="#1F7A3A" stroke-width="6" stroke-linecap="round" opacity="0.4" />

  <!-- Trash Can Lid -->
  <path d="M 145 185 C 145 175 160 165 180 165 L 332 165 C 352 165 367 175 367 185 L 367 195 L 145 195 Z" fill="#22833F" stroke="#165B2B" stroke-width="6" />
  <!-- Lid handle -->
  <path d="M 226 165 C 226 140 286 140 286 165" fill="none" stroke="#22833F" stroke-width="12" stroke-linecap="round" />

  <!-- Eyes - cute anime style -->
  <ellipse cx="220" cy="280" rx="14" ry="18" fill="#1E293B" />
  <circle cx="216" cy="274" r="5" fill="#FFFFFF" />
  <circle cx="224" cy="285" r="2.5" fill="#FFFFFF" />

  <ellipse cx="292" cy="280" rx="14" ry="18" fill="#1E293B" />
  <circle cx="288" cy="274" r="5" fill="#FFFFFF" />
  <circle cx="296" cy="285" r="2.5" fill="#FFFFFF" />

  <!-- Rosy cheeks -->
  <ellipse cx="195" cy="305" rx="10" ry="6" fill="#F472B6" opacity="0.6" />
  <ellipse cx="317" cy="305" rx="10" ry="6" fill="#F472B6" opacity="0.6" />

  <!-- Big smile -->
  <path d="M 234 308 C 242 328 270 328 278 308" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />

  <!-- Little Golden Star Badge near lid -->
  <path d="M 335 145 L 342 162 L 360 163 L 346 174 L 350 192 L 335 181 L 320 192 L 324 174 L 310 163 L 328 162 Z" fill="url(#starGrad)" stroke="#B45309" stroke-width="2" />

  <!-- Recycle symbol on chest -->
  <g transform="translate(256, 355) scale(0.65)">
    <path d="M -15 -25 L 15 -25 L 5 -40" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 25 -5 L 35 25 L 15 25" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -10 25 L -35 10 L -25 -5" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
